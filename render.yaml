services:
  - type: web
    name: reelhouse-music
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./music-backend/Dockerfile
    dockerContext: ./music-backend
    healthCheckPath: /v1/health
    autoDeploy: false
    envVars:
      - key: PORT
        value: "8080"
      - key: MUSIC_BACKEND_PUBLIC_URL
        sync: false
      - key: MUSIC_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Optional: leave blank to run without Spotify OAuth. ZIP imports still work.
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        sync: false
      - key: SPOTIFY_CONNECT_REDIRECT_PATH
        value: /music?spotify=connected
      - key: REELHOUSE_APP_URL
        sync: false
      - key: REELHOUSE_ALLOWED_ORIGINS
        sync: false
      - key: LRCLIB_USER_AGENT
        value: ReelhouseMusic/1.0 (https://reelhouse.app; music@reelhouse.app)
      - key: BETTERLYRICS_API_KEY
        sync: false
      - key: MUSICBRAINZ_USER_AGENT
        value: ReelhouseMusic/1.0 (https://reelhouse.app; music@reelhouse.app)
      - key: MUSIC_MAX_IMPORT_BYTES
        value: "104857600"
      - key: MUSIC_MAX_IMPORT_UNCOMPRESSED_BYTES
        value: "419430400"
      - key: MUSIC_MAX_JSON_ENTRY_BYTES
        value: "50331648"
