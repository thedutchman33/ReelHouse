<!doctype html>
<html
  lang="en"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Ground","default":"#111212"},
    {"id":"color-ink","type":"color","label":"Ink","default":"#F2F3F2"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#10B981"},
    {"id":"color-surface","type":"color","label":"Surface","default":"#1A1C1B"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0c0c;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #111212;
      }
      .scene-host {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20.19"
      data-width="1920"
      data-height="1080"
    >
      <!-- 1 · Which server actually works? 0.00 - 2.73 -->
      <div
        id="host-s1"
        class="scene-host"
        data-composition-id="s1"
        data-composition-src="compositions/s1-hook.html"
        data-start="0"
        data-duration="2.73"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- 2 · Measured, not claimed. 2.73 - 7.09 -->
      <div
        id="host-s2"
        class="scene-host"
        data-composition-id="s2"
        data-composition-src="compositions/s2-measure.html"
        data-start="2.73"
        data-duration="4.36"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- 3 · Switch server. Keep your place. 7.09 - 10.93 -->
      <div
        id="host-s3"
        class="scene-host"
        data-composition-id="s3"
        data-composition-src="compositions/s3-watch.html"
        data-start="7.09"
        data-duration="3.84"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- 4 · One card per title. 10.93 - 14.73 -->
      <div
        id="host-s4"
        class="scene-host"
        data-composition-id="s4"
        data-composition-src="compositions/s4-resume.html"
        data-start="10.93"
        data-duration="3.80"
        data-track-index="4"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- 5 · Oh - and live sport. 14.73 - 16.93 -->
      <div
        id="host-s5"
        class="scene-host"
        data-composition-id="s5"
        data-composition-src="compositions/s5-sport.html"
        data-start="14.73"
        data-duration="2.20"
        data-track-index="5"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- 6 · The receipts. 16.93 - 20.19 -->
      <div
        id="host-s6"
        class="scene-host"
        data-composition-id="s6"
        data-composition-src="compositions/s6-receipts.html"
        data-start="16.93"
        data-duration="3.26"
        data-track-index="6"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Music bed: steady and clean, 109.96 BPM. -->
      <audio
        id="music-bed"
        data-start="0"
        data-duration="20.19"
        data-track-index="10"
        data-volume="0.30"
        data-fade-out="0.55"
        src="assets/music/bed.mp3"
      ></audio>

      <!-- Sound design: sparse, motion-matched. -->
      <audio
        id="sfx-hook-chip"
        data-start="1.64"
        data-duration="0.12"
        data-track-index="11"
        data-volume="0.40"
        src="assets/sfx/impact/impactSoft_medium_000.ogg"
      ></audio>
      <audio
        id="sfx-server-check"
        data-start="5.34"
        data-duration="0.21"
        data-track-index="12"
        data-volume="0.32"
        src="assets/sfx/impact/impactGlass_light_001.ogg"
      ></audio>
      <audio
        id="sfx-play-click"
        data-start="8.17"
        data-duration="0.01"
        data-track-index="13"
        data-volume="0.45"
        src="assets/sfx/interface/click_005.ogg"
      ></audio>
      <audio
        id="sfx-switch-click"
        data-start="8.95"
        data-duration="0.01"
        data-track-index="14"
        data-volume="0.30"
        src="assets/sfx/interface/click_003.ogg"
      ></audio>
      <audio
        id="sfx-card-1"
        data-start="12.02"
        data-duration="0.60"
        data-track-index="15"
        data-volume="0.34"
        src="assets/sfx/casino/card-slide-1.ogg"
      ></audio>
      <audio
        id="sfx-card-3"
        data-start="13.11"
        data-duration="0.60"
        data-track-index="16"
        data-volume="0.34"
        src="assets/sfx/casino/card-slide-3.ogg"
      ></audio>
      <audio
        id="sfx-logo"
        data-start="18.56"
        data-duration="1.48"
        data-track-index="17"
        data-volume="0.40"
        src="assets/sfx/impact/impactBell_heavy_000.ogg"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
